<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; color: #ccc; font-family: monospace; font-size: 12px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#top-bar { background: #111; border-bottom: 1px solid #333; padding: 5px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#top-bar-left { color: #3498db; font-size: 11px; letter-spacing: 2px; }
#top-bar-right { display: flex; gap: 10px; align-items: center; }
#live-indicator { color: #2ecc71; font-size: 10px; }
#updated-label { color: #555; font-size: 10px; }
#scan-btn { background: #1a3a1a; border: 1px solid #2a5a2a; color: #2ecc71; font-size: 9px; padding: 2px 8px; border-radius: 2px; cursor: pointer; }
#scan-btn:hover { background: #1f4a1f; }
#error-bar { display: none; background: #1a0a0a; border-bottom: 1px solid #4a2a2a; padding: 3px 12px; color: #e67e22; font-size: 9px; flex-shrink: 0; }
#stat-header { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1px; background: #1a1a1a; flex-shrink: 0; overflow: hidden; }
.stat-tile { background: #0d0d0d; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; }
#resize-handle { height: 5px; background: #0a1520; cursor: ns-resize; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-top: 1px solid #1a3a5a; border-bottom: 1px solid #1a3a5a; }
#resize-handle::after { content: ''; width: 48px; height: 2px; background: #2a5a8a; border-radius: 1px; }
#resize-handle:hover { background: #0d2040; }
.stat-label { color: #555; font-size: 8px; letter-spacing: 1px; margin-bottom: 3px; }
.stat-value { display: flex; align-items: baseline; gap: 4px; }
.stat-num { color: #fff; font-size: 18px; font-weight: bold; }
.stat-unit { font-size: 8px; }
.stat-sub { color: #555; font-size: 8px; margin-top: 1px; }
.ok { color: #2ecc71; }
.warn { color: #e67e22; }
.high { color: #e74c3c; }
#tab-bar { display: flex; align-items: stretch; border-bottom: 1px solid #1a1a1a; background: #0a0a0a; flex-shrink: 0; }
.tab { padding: 5px 12px; font-size: 9px; color: #555; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #888; }
.tab.active { color: #3498db; border-bottom-color: #3498db; background: #0d0d0d; }
.tab.soon { color: #333; cursor: default; }
.soon-badge { font-size: 7px; border: 1px solid #333; padding: 0 2px; border-radius: 2px; margin-left: 3px; }
#tab-content { flex: 1; overflow-y: auto; padding: 8px 10px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.tbl-header { gap: 4px; margin-bottom: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 3px; }
.tbl-header span { color: #444; font-size: 8px; letter-spacing: 1px; }
.proc-grid { display: grid; grid-template-columns: minmax(60px, 180px) 90px 58px 52px 46px; gap: 4px; }
.proc-row { display: grid; grid-template-columns: minmax(60px, 180px) 90px 58px 52px 46px; gap: 4px; align-items: center; margin-bottom: 5px; cursor: pointer; border-radius: 2px; }
.proc-row:hover { background: #0d1a22; }
.mem-cell { display: flex; flex-direction: column; gap: 1px; }
.mem-bar-bg { background: #1a1a1a; height: 3px; border-radius: 1px; }
.mem-bar { height: 100%; border-radius: 1px; }
.kill-btn { background: #2a1a1a; border: 1px solid #4a2a2a; color: #e74c3c; font-size: 8px; padding: 1px 5px; border-radius: 2px; cursor: pointer; white-space: nowrap; }
.kill-btn:hover { background: #3a1a1a; }
.kill-btn:disabled { opacity: 0.5; cursor: default; }
.mcp-row { display: grid; grid-template-columns: 1fr 80px 100px 55px; gap: 4px; align-items: center; margin-bottom: 5px; }
.res-section { margin-bottom: 12px; }
.res-label-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
.res-bar-bg { background: #1a1a1a; height: 6px; border-radius: 3px; }
.res-bar { height: 100%; border-radius: 3px; transition: width 0.3s; }
.coming-soon { display: flex; align-items: center; justify-content: center; height: 120px; color: #333; font-size: 10px; letter-spacing: 2px; }
#tab-content.chat-active { padding: 0; overflow: hidden; }
#pane-ai { display: flex; flex-direction: column; height: 100%; }
#chat-msgs { flex: 1; overflow-y: auto; padding: 8px 10px 4px; }
.chat-msg { padding: 5px 8px; border-radius: 3px; font-size: 9px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-bottom: 5px; }
.chat-msg.you { background: #0d2040; color: #8ab4d4; margin-left: 15%; border: 1px solid #1a4a7a; }
.chat-msg.ai { background: #0a1510; color: #7abf7a; margin-right: 15%; border: 1px solid #1a4a1a; }
.chat-msg.sys { color: #333; font-size: 8px; text-align: center; }
.chat-msg.err { background: #1a0808; color: #e74c3c; border: 1px solid #4a1a1a; }
#chat-input-bar { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid #1a1a1a; flex-shrink: 0; }
#chat-input { flex: 1; background: #0d0d0d; border: 1px solid #1a3a5a; color: #ccc; font-family: monospace; font-size: 10px; padding: 4px 8px; border-radius: 2px; outline: none; }
#chat-input:focus { border-color: #3498db; }
#chat-send { background: #0d2040; border: 1px solid #1a4a7a; color: #3498db; font-size: 9px; padding: 3px 10px; cursor: pointer; border-radius: 2px; white-space: nowrap; }
#chat-send:hover { background: #142a50; }
#chat-send:disabled { opacity: 0.4; cursor: default; }
.proc-detail { background: #080f18; border-left: 2px solid #1a4a7a; padding: 6px 10px; margin: -3px 0 6px 0; }
.proc-detail-desc { color: #6a9cbf; font-size: 9px; line-height: 1.5; margin-bottom: 5px; }
.proc-detail-grid { display: grid; grid-template-columns: 52px 1fr; gap: 2px 8px; }
.proc-detail-key { color: #333; font-size: 8px; letter-spacing: 1px; }
.proc-detail-val { color: #778; font-size: 8px; word-break: break-all; }
.sparkline { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 3px; overflow: hidden; }
.spark-bar { min-width: 5px; border-radius: 1px 1px 0 0; flex-grow: 1; }
.hist-row { display: grid; grid-template-columns: 70px 42px 42px 48px 1fr; gap: 4px; align-items: center; padding: 3px 0; border-bottom: 1px solid #111; }
.change-pill { display: inline-block; font-size: 7px; padding: 0 3px; border-radius: 2px; margin-right: 2px; }
.pill-new { background: #0a2a0a; color: #2ecc71; }
.pill-gone { background: #2a0a0a; color: #e74c3c; }
</style>
</head>
<body>

<div id="top-bar">
  <span id="top-bar-left">&#128421; OPS DASHBOARD</span>
  <div id="top-bar-right">
    <span id="live-indicator">&#9679; LIVE</span>
    <span id="updated-label">scanning&#8230;</span>
    <button id="scan-btn" onclick="doScan()">&#8634; Scan</button>
  </div>
</div>

<div id="error-bar"></div>

<div id="stat-header">
  <div class="stat-tile">
    <div class="stat-label">PORTS</div>
    <div class="stat-value"><span class="stat-num" id="stat-ports">&#8212;</span><span class="stat-unit ok">active</span></div>
    <div class="stat-sub" id="stat-ports-sub">&#8212;</div>
  </div>
  <div class="stat-tile">
    <div class="stat-label">PROCESSES</div>
    <div class="stat-value"><span class="stat-num" id="stat-procs">&#8212;</span><span class="stat-unit ok">unique</span></div>
    <div class="stat-sub" id="stat-procs-sub">&#8212;</div>
  </div>
  <div class="stat-tile">
    <div class="stat-label">MCP</div>
    <div class="stat-value"><span class="stat-num" id="stat-mcp">&#8212;</span><span class="stat-unit" id="stat-mcp-unit">running</span></div>
    <div class="stat-sub" id="stat-mcp-sub">&#8212;</div>
  </div>
  <div class="stat-tile">
    <div class="stat-label">ENERGY</div>
    <div class="stat-value"><span class="stat-num ok" id="stat-energy">&#8212;</span></div>
    <div class="stat-sub" id="stat-energy-sub">&#8212;</div>
  </div>
</div>

<div id="resize-handle"></div>

<div id="tab-bar">
  <div class="tab active" onclick="switchTab('processes')">PROCESSES</div>
  <div class="tab" onclick="switchTab('mcp')">MCP</div>
  <div class="tab" onclick="switchTab('resources')">RESOURCES</div>
  <div class="tab" onclick="switchTab('history')">HISTORY</div>
  <div class="tab" onclick="switchTab('energy')">ENERGY</div>
  <div class="tab" onclick="switchTab('ai')">AI</div>
</div>

<div id="tab-content">
  <div id="pane-processes" class="tab-pane active">
    <div class="tbl-header proc-grid">
      <span>PROCESS</span><span>MEMORY</span><span>PORT</span><span>PID</span><span>ACTION</span>
    </div>
    <div id="proc-rows"></div>
  </div>
  <div id="pane-mcp" class="tab-pane">
    <div class="tbl-header mcp-row">
      <span>SERVER</span><span>BRIDGE</span><span>SERVICE API</span><span>PID</span>
    </div>
    <div id="mcp-rows"></div>
  </div>
  <div id="pane-resources" class="tab-pane">
    <div id="res-content"></div>
  </div>
  <div id="pane-history" class="tab-pane">
    <div class="tbl-header hist-row" style="border-bottom:1px solid #1a1a1a;padding-bottom:3px;margin-bottom:4px;">
      <span>TIME</span><span>PORTS</span><span>PROCS</span><span>MCP</span><span>CHANGES</span>
    </div>
    <div id="hist-rows"><div style="color:#333;font-size:9px;padding:10px 0;">Collecting history&#8230;</div></div>
  </div>
  <div id="pane-energy" class="tab-pane">
    <div id="energy-content"></div>
  </div>
  <div id="pane-ai" class="tab-pane">
    <div id="chat-msgs"></div>
    <div id="chat-input-bar">
      <input id="chat-input" type="text" placeholder="Ask about your system&#8230;" autocomplete="off" />
      <button id="chat-send" onclick="sendChat()">ASK &#8629;</button>
    </div>
  </div>
</div>

<script>
var _secondsSinceUpdate = 0;
var _lastScan = null;

var MCP_PORT_MAP = { 'neurolinked-brain': 8000, 'obsidian': 27123 };

var PROC_DESC = {
  'lsass.exe': 'Local Security Authority — Windows authentication, login tokens, and security policy enforcement. Core OS process; killing it crashes Windows.',
  'svchost.exe': 'Service Host — generic Windows container that runs multiple background services. Many instances running simultaneously is normal.',
  'python.exe': 'Python interpreter — running a Python script or web server (FastAPI, Flask, etc).',
  'uvicorn': 'Uvicorn ASGI server — serves FastAPI and Starlette web applications.',
  'node.exe': 'Node.js — JavaScript server-side runtime. Used by many CLI tools, MCP servers, and web backends.',
  'Obsidian.exe': 'Obsidian — Markdown note-taking app. Runs a local server on port 27123 for plugin and MCP access.',
  'chrome.exe': 'Google Chrome browser.',
  'msedge.exe': 'Microsoft Edge browser.',
  'Code.exe': 'Visual Studio Code — code editor.',
  'WindowsTerminal.exe': 'Windows Terminal — modern terminal emulator for PowerShell, CMD, WSL.',
  'java.exe': 'Java Virtual Machine — running a Java application.',
  'SearchIndexer.exe': 'Windows Search Indexer — indexes file contents for fast search. High I/O during indexing bursts is normal.',
  'MsMpEng.exe': 'Windows Defender — real-time antivirus and malware scanning engine.',
  'explorer.exe': 'Windows Explorer — desktop shell, file manager, and taskbar.',
  'RuntimeBroker.exe': 'Runtime Broker — manages permissions for Microsoft Store / UWP apps.',
  'spoolsv.exe': 'Print Spooler — manages the print job queue.',
  'WmiPrvSE.exe': 'WMI Provider Host — handles Windows Management Instrumentation queries from scripts and tools.',
  'nginx.exe': 'Nginx — web server and reverse proxy.',
  'postgres.exe': 'PostgreSQL — relational database server.',
  'redis-server.exe': 'Redis — in-memory key-value store and cache.',
  'wininit.exe': 'Windows Initialization Process — starts core subsystems at boot. Fundamental OS process.',
  'services.exe': 'Windows Service Control Manager — starts, stops, and monitors background services.',
};

var _scanHistory = [];
var _resHistory  = [];
var _chatHistory = [];
var _chatLoading = false;

// ── Drag-to-resize stat header ────────────────────────────────
var _statHeader = document.getElementById('stat-header');
var _rHandle = document.getElementById('resize-handle');
var _rDragging = false, _rStartY = 0, _rStartH = 0;
var STAT_H_MIN = 52, STAT_H_MAX = 200;

_rHandle.addEventListener('mousedown', function(e) {
  _rDragging = true; _rStartY = e.clientY; _rStartH = _statHeader.offsetHeight;
  document.body.style.userSelect = 'none'; e.preventDefault();
});
document.addEventListener('mousemove', function(e) {
  if (!_rDragging) return;
  var newH = Math.max(STAT_H_MIN, Math.min(STAT_H_MAX, _rStartH + (e.clientY - _rStartY)));
  _statHeader.style.height = newH + 'px';
});
document.addEventListener('mouseup', function() {
  if (_rDragging) { _rDragging = false; document.body.style.userSelect = ''; localStorage.setItem('dash-stat-h', _statHeader.offsetHeight); }
});
(function() {
  var h = parseInt(localStorage.getItem('dash-stat-h') || '0');
  if (h >= STAT_H_MIN && h <= STAT_H_MAX) _statHeader.style.height = h + 'px';
})();

function switchTab(name) {
  var tabs = document.querySelectorAll('.tab');
  var names = ['processes','mcp','resources','history','energy','ai'];
  tabs.forEach(function(t, i) { t.classList.toggle('active', names[i] === name); });
  document.querySelectorAll('.tab-pane').forEach(function(p) {
    p.classList.toggle('active', p.id === 'pane-' + name);
  });
  document.getElementById('tab-content').classList.toggle('chat-active', name === 'ai');
  if (name === 'history') renderHistory();
  if (name === 'energy') renderEnergy();
  if (name === 'ai') renderChat();
}

function setError(msg) {
  var el = document.getElementById('error-bar');
  if (msg) { el.style.display = 'block'; el.textContent = '⚠ ' + msg; }
  else { el.style.display = 'none'; }
}

async function fetchScan() {
  try {
    var r = await fetch('/api/scan');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    _lastScan = data;
    _secondsSinceUpdate = 0;
    setError(null);
    renderStatHeader(data);
    renderProcesses(data.ports || []);
    renderMCP(data.mcp_servers || []);
    var mcps = data.mcp_servers || [];
    _scanHistory.push({
      ts: Date.now(),
      portCount: (data.ports || []).length,
      procCount: (data.summary || {}).process_count || 0,
      mcpRunning: mcps.filter(function(m) { return m.running; }).length,
      mcpTotal: mcps.length,
      procs: Array.from(new Set((data.ports || []).map(function(p) { return p.process; }))),
    });
    if (_scanHistory.length > 30) _scanHistory.shift();
  } catch(e) {
    setError('Scan failed — ' + e.message);
  }
}

function renderStatHeader(data) {
  var ports = data.ports || [];
  var mcps = data.mcp_servers || [];
  var summary = data.summary || {};
  document.getElementById('stat-ports').textContent = ports.length;
  var agentCount = ports.filter(function(p) { return p.label; }).length;
  document.getElementById('stat-ports-sub').textContent = agentCount + ' agent' + (agentCount !== 1 ? 's' : '') + ' · ' + (ports.length - agentCount) + ' other';
  document.getElementById('stat-procs').textContent = summary.process_count || 0;
  var topProc = ports.slice().sort(function(a,b) { return (b.memory_mb||0) - (a.memory_mb||0); })[0];
  document.getElementById('stat-procs-sub').textContent = topProc ? 'top: ' + topProc.process + ' ' + Math.round(topProc.memory_mb||0) + 'MB' : 'none';
  var running = mcps.filter(function(m) { return m.running; }).length;
  var mcpEl = document.getElementById('stat-mcp');
  var mcpUnit = document.getElementById('stat-mcp-unit');
  mcpEl.textContent = running + '/' + mcps.length;
  mcpEl.className = 'stat-num ' + (running === mcps.length ? 'ok' : 'warn');
  mcpUnit.className = 'stat-unit ' + (running === mcps.length ? 'ok' : 'warn');
  var runningNames = mcps.filter(function(m) { return m.running; }).map(function(m) { return m.name; }).join(', ');
  document.getElementById('stat-mcp-sub').textContent = runningNames || 'none running';
}

function renderProcesses(ports) {
  var seen = {};
  var deduped = ports.slice().sort(function(a,b) { return (b.memory_mb||0) - (a.memory_mb||0); }).filter(function(p) {
    if (seen[p.process]) return false;
    seen[p.process] = true;
    return true;
  });
  var maxMem = deduped.length ? (deduped[0].memory_mb || 1) : 1;
  var container = document.getElementById('proc-rows');
  container.innerHTML = '';
  deduped.forEach(function(p) {
    var pct = Math.max(1, Math.round(((p.memory_mb||0) / maxMem) * 100));
    var memColor = p.memory_mb > 1000 ? '#e67e22' : p.memory_mb > 300 ? '#f0e68c' : '#2ecc71';
    var row = document.createElement('div');
    row.className = 'proc-row';
    row.dataset.pid = p.pid;
    var nameEl = document.createElement('span');
    nameEl.style.cssText = 'color:#ccc;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    nameEl.textContent = p.process;
    row.onclick = (function(proc, r) { return function(e) { if (e.target.classList.contains('kill-btn')) return; showProcessDetail(proc, r); }; })(p, row);
    var memCell = document.createElement('div');
    memCell.className = 'mem-cell';
    var memVal = document.createElement('span');
    memVal.style.cssText = 'color:' + memColor + ';font-size:8px;';
    memVal.textContent = Math.round(p.memory_mb||0) + ' MB';
    var barBg = document.createElement('div');
    barBg.className = 'mem-bar-bg';
    var bar = document.createElement('div');
    bar.className = 'mem-bar';
    bar.style.cssText = 'width:' + pct + '%;background:' + memColor + ';';
    barBg.appendChild(bar);
    memCell.appendChild(memVal);
    memCell.appendChild(barBg);
    var portEl = document.createElement('span');
    portEl.style.cssText = 'color:#555;font-size:8px;';
    portEl.textContent = p.port || '—';
    var pidEl = document.createElement('span');
    pidEl.style.cssText = 'color:#555;font-size:8px;';
    pidEl.textContent = p.pid || '—';
    var killBtn = document.createElement('button');
    killBtn.className = 'kill-btn';
    killBtn.textContent = 'kill';
    killBtn.onclick = (function(pid, r, btn) { return function() { killProcess(pid, r, btn); }; })(p.pid, row, killBtn);
    row.appendChild(nameEl);
    row.appendChild(memCell);
    row.appendChild(portEl);
    row.appendChild(pidEl);
    row.appendChild(killBtn);
    container.appendChild(row);
  });
}

function showProcessDetail(p, row) {
  var existing = row.nextElementSibling;
  if (existing && existing.classList.contains('proc-detail')) { existing.remove(); return; }
  document.querySelectorAll('.proc-detail').forEach(function(d) { d.remove(); });
  var detail = document.createElement('div');
  detail.className = 'proc-detail';
  var descEl = document.createElement('div');
  descEl.className = 'proc-detail-desc';
  descEl.textContent = PROC_DESC[p.process] || 'No description available for this process.';
  detail.appendChild(descEl);
  var grid = document.createElement('div');
  grid.className = 'proc-detail-grid';
  function addRow(key, val) {
    var k = document.createElement('span'); k.className = 'proc-detail-key'; k.textContent = key;
    var v = document.createElement('span'); v.className = 'proc-detail-val'; v.textContent = val;
    grid.appendChild(k); grid.appendChild(v);
  }
  addRow('PID', p.pid || '—');
  addRow('PORT', p.port || '—');
  addRow('RAM', Math.round(p.memory_mb || 0) + ' MB');
  if (p.label) addRow('LABEL', p.label);
  detail.appendChild(grid);
  row.parentNode.insertBefore(detail, row.nextSibling);
  fetch('/api/process/' + p.pid).then(function(r) {
    if (!r.ok) return null;
    return r.json();
  }).then(function(data) {
    if (!data) return;
    if (data.exe) addRow('EXE', data.exe);
    if (data.username) addRow('USER', data.username);
    if (data.cpu_percent !== undefined) addRow('CPU', data.cpu_percent.toFixed(1) + '%');
    if (data.status) addRow('STATUS', data.status);
    if (data.cmdline && data.cmdline.length) addRow('CMD', data.cmdline.join(' ').substring(0, 80));
  }).catch(function() {});
}

function renderMCP(mcps) {
  var activePorts = new Set((_lastScan && _lastScan.ports || []).map(function(p) { return p.port; }));
  var container = document.getElementById('mcp-rows');
  container.innerHTML = '';
  mcps.forEach(function(m) {
    var row = document.createElement('div');
    row.className = 'mcp-row';
    var nameEl = document.createElement('span');
    nameEl.style.cssText = 'color:#ccc;font-size:9px;';
    nameEl.textContent = m.name;
    var bridgeEl = document.createElement('span');
    bridgeEl.style.fontSize = '8px';
    bridgeEl.style.color = m.running ? '#2ecc71' : '#444';
    bridgeEl.textContent = m.running ? '✓ bridge' : '— bridge';
    var svcPort = MCP_PORT_MAP[m.name];
    var svcEl = document.createElement('span');
    svcEl.style.fontSize = '8px';
    if (svcPort !== undefined) {
      var svcUp = activePorts.has(svcPort);
      svcEl.style.color = svcUp ? '#2ecc71' : '#e74c3c';
      svcEl.textContent = svcUp ? '✓ api :' + svcPort : '✗ api :' + svcPort;
    } else {
      svcEl.style.color = '#333';
      svcEl.textContent = '—';
    }
    var pidEl = document.createElement('span');
    pidEl.style.cssText = 'color:#555;font-size:8px;';
    pidEl.textContent = m.pid || '—';
    row.appendChild(nameEl);
    row.appendChild(bridgeEl);
    row.appendChild(svcEl);
    row.appendChild(pidEl);
    container.appendChild(row);
  });
}

async function killProcess(pid, row, btn) {
  btn.disabled = true;
  btn.textContent = 'killing…';
  try {
    var r = await fetch('/api/kill/' + pid, { method: 'POST' });
    if (r.status === 403) {
      btn.textContent = 'denied';
      btn.style.color = '#e67e22';
      setTimeout(function() { btn.textContent = 'kill'; btn.style.color = ''; btn.disabled = false; }, 2000);
      return;
    }
    if (r.status === 404) {
      btn.textContent = 'gone';
      btn.style.color = '#555';
      row.style.opacity = '0.4';
      setTimeout(function() { row.remove(); fetchScan(); }, 1500);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    row.remove();
    await fetchScan();
  } catch(e) {
    btn.textContent = 'error';
    setTimeout(function() { btn.textContent = 'kill'; btn.disabled = false; }, 2000);
  }
}

async function fetchResources() {
  try {
    var r = await fetch('/api/resources');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    renderResources(data);
    var cpu = data.cpu_percent || 0;
    var energyEl = document.getElementById('stat-energy');
    var energySub = document.getElementById('stat-energy-sub');
    if (cpu > 70) { energyEl.textContent = 'HIGH'; energyEl.className = 'stat-num high'; }
    else if (cpu > 40) { energyEl.textContent = 'BUSY'; energyEl.className = 'stat-num warn'; }
    else { energyEl.textContent = 'OK'; energyEl.className = 'stat-num ok'; }
    energySub.textContent = 'cpu ' + cpu.toFixed(1) + '%';
    _resHistory.push({ ts: Date.now(), cpu: cpu, ramPct: data.memory ? data.memory.percent : 0, ramRaw: data.memory || null, diskPct: data.disk ? data.disk.percent : 0 });
    if (_resHistory.length > 30) _resHistory.shift();
  } catch(e) { /* non-fatal */ }
}

function renderResources(data) {
  var container = document.getElementById('res-content');
  container.innerHTML = '';
  function fmtBytes(b) { return b >= 1073741824 ? (b/1073741824).toFixed(1) + ' GB' : (b/1048576).toFixed(0) + ' MB'; }
  function barColor(pct) { return pct > 70 ? '#e74c3c' : pct > 40 ? '#e67e22' : '#2ecc71'; }
  function addBar(label, pct, subLabel) {
    var color = barColor(pct);
    var sec = document.createElement('div');
    sec.className = 'res-section';
    var labelRow = document.createElement('div');
    labelRow.className = 'res-label-row';
    var lSpan = document.createElement('span');
    lSpan.style.cssText = 'color:#888;font-size:9px;';
    lSpan.textContent = label;
    var rSpan = document.createElement('span');
    rSpan.style.cssText = 'color:' + color + ';font-size:9px;';
    rSpan.textContent = subLabel;
    labelRow.appendChild(lSpan);
    labelRow.appendChild(rSpan);
    var barBg = document.createElement('div');
    barBg.className = 'res-bar-bg';
    var bar = document.createElement('div');
    bar.className = 'res-bar';
    bar.style.cssText = 'width:' + Math.min(pct,100) + '%;background:' + color + ';';
    barBg.appendChild(bar);
    sec.appendChild(labelRow);
    sec.appendChild(barBg);
    container.appendChild(sec);
  }
  addBar('CPU', data.cpu_percent || 0, (data.cpu_percent||0).toFixed(1) + '%');
  if (data.memory) {
    var m = data.memory;
    addBar('RAM', m.percent || 0, fmtBytes(m.used) + ' / ' + fmtBytes(m.total) + ' (' + (m.percent||0).toFixed(1) + '%)');
  }
  if (data.disk) {
    var d = data.disk;
    addBar('DISK', d.percent || 0, fmtBytes(d.used) + ' / ' + fmtBytes(d.total) + ' (' + (d.percent||0).toFixed(1) + '%)');
  }
}

function renderHistory() {
  var container = document.getElementById('hist-rows');
  if (!container) return;
  if (_scanHistory.length === 0) {
    container.innerHTML = '<div style="color:#333;font-size:9px;padding:10px 0;">Collecting history…</div>';
    return;
  }
  container.innerHTML = '';
  var reversed = _scanHistory.slice().reverse();
  reversed.forEach(function(entry, i) {
    var prev = reversed[i + 1];
    var row = document.createElement('div');
    row.className = 'hist-row';
    var d = new Date(entry.ts);
    var timeEl = document.createElement('span');
    timeEl.style.cssText = 'color:#555;font-size:8px;';
    timeEl.textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
    var portEl = document.createElement('span');
    portEl.style.cssText = 'color:#aaa;font-size:9px;';
    portEl.textContent = entry.portCount;
    var procEl = document.createElement('span');
    procEl.style.cssText = 'color:#aaa;font-size:9px;';
    procEl.textContent = entry.procCount;
    var mcpColor = entry.mcpRunning === entry.mcpTotal ? '#2ecc71' : '#e67e22';
    var mcpEl = document.createElement('span');
    mcpEl.style.cssText = 'color:' + mcpColor + ';font-size:9px;';
    mcpEl.textContent = entry.mcpRunning + '/' + entry.mcpTotal;
    var changesEl = document.createElement('span');
    changesEl.style.fontSize = '8px';
    if (prev) {
      var prevSet = new Set(prev.procs);
      var curSet = new Set(entry.procs);
      var added = entry.procs.filter(function(n) { return !prevSet.has(n); });
      var removed = prev.procs.filter(function(n) { return !curSet.has(n); });
      added.slice(0, 3).forEach(function(n) {
        var pill = document.createElement('span');
        pill.className = 'change-pill pill-new';
        pill.textContent = '+' + n.replace('.exe','');
        changesEl.appendChild(pill);
      });
      removed.slice(0, 3).forEach(function(n) {
        var pill = document.createElement('span');
        pill.className = 'change-pill pill-gone';
        pill.textContent = '-' + n.replace('.exe','');
        changesEl.appendChild(pill);
      });
      if (!added.length && !removed.length) { changesEl.style.color = '#333'; changesEl.textContent = '—'; }
    } else {
      changesEl.style.color = '#333'; changesEl.textContent = 'baseline';
    }
    row.appendChild(timeEl); row.appendChild(portEl); row.appendChild(procEl);
    row.appendChild(mcpEl); row.appendChild(changesEl);
    container.appendChild(row);
  });
}

function renderEnergy() {
  var container = document.getElementById('energy-content');
  if (!container) return;
  container.innerHTML = '';
  if (_resHistory.length === 0) {
    container.innerHTML = '<div style="color:#333;font-size:9px;padding:10px 0;">Collecting data…</div>';
    return;
  }
  function fmtBytes(b) { return b >= 1073741824 ? (b/1073741824).toFixed(1)+' GB' : (b/1048576).toFixed(0)+' MB'; }
  function barColor(pct) { return pct > 70 ? '#e74c3c' : pct > 40 ? '#e67e22' : '#2ecc71'; }
  var latest = _resHistory[_resHistory.length - 1];
  function addTrend(label, values, currentLabel) {
    var sec = document.createElement('div'); sec.className = 'res-section';
    var labelRow = document.createElement('div'); labelRow.className = 'res-label-row';
    var lSpan = document.createElement('span'); lSpan.style.cssText = 'color:#888;font-size:9px;'; lSpan.textContent = label;
    var rSpan = document.createElement('span'); rSpan.style.cssText = 'color:'+barColor(values[values.length-1])+';font-size:9px;'; rSpan.textContent = currentLabel;
    labelRow.appendChild(lSpan); labelRow.appendChild(rSpan);
    var spark = document.createElement('div'); spark.className = 'sparkline';
    var refMax = Math.max.apply(null, values.concat([5]));
    values.forEach(function(v) {
      var bar = document.createElement('div'); bar.className = 'spark-bar';
      bar.style.height = Math.max(2, Math.round((v / refMax) * 28)) + 'px';
      bar.style.background = barColor(v);
      spark.appendChild(bar);
    });
    sec.appendChild(labelRow); sec.appendChild(spark);
    container.appendChild(sec);
  }
  addTrend('CPU', _resHistory.map(function(r) { return r.cpu; }), latest.cpu.toFixed(1) + '%');
  var mem = latest.ramRaw;
  var ramLabel = mem ? fmtBytes(mem.used)+' / '+fmtBytes(mem.total)+' ('+latest.ramPct.toFixed(1)+'%)' : latest.ramPct.toFixed(1)+'%';
  addTrend('RAM', _resHistory.map(function(r) { return r.ramPct; }), ramLabel);
  addTrend('DISK', _resHistory.map(function(r) { return r.diskPct; }), latest.diskPct.toFixed(1) + '%');
}

function renderChat() {
  var msgs = document.getElementById('chat-msgs');
  if (!msgs) return;
  msgs.innerHTML = '';
  if (_chatHistory.length === 0) {
    var sys = document.createElement('div');
    sys.className = 'chat-msg sys';
    sys.textContent = 'Ask anything about your system — processes, ports, memory, MCP servers.';
    msgs.appendChild(sys);
    return;
  }
  _chatHistory.forEach(function(entry) {
    var div = document.createElement('div');
    div.className = 'chat-msg ' + entry.role;
    div.textContent = entry.text;
    msgs.appendChild(div);
  });
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat() {
  if (_chatLoading) return;
  var input = document.getElementById('chat-input');
  var msg = input.value.trim();
  if (!msg) return;
  _chatLoading = true;
  var btn = document.getElementById('chat-send');
  btn.disabled = true;
  input.value = '';
  _chatHistory.push({ role: 'you', text: msg });
  renderChat();
  try {
    var r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, model: 'llama3.2:3b' }),
    });
    var data = await r.json();
    if (r.status === 503 || !data.available) {
      _chatHistory.push({ role: 'err', text: data.reply || 'Ollama is not running. Run: ollama pull llama3.2:3b' });
    } else {
      _chatHistory.push({ role: 'ai', text: data.reply });
    }
  } catch(e) {
    _chatHistory.push({ role: 'err', text: 'Request failed — ' + e.message });
  }
  _chatLoading = false;
  btn.disabled = false;
  renderChat();
}

document.getElementById('chat-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendChat();
});

function tickUpdated() {
  _secondsSinceUpdate++;
  document.getElementById('updated-label').textContent = 'updated ' + _secondsSinceUpdate + 's ago';
}

async function doScan() {
  await Promise.all([fetchScan(), fetchResources()]);
}

doScan();
setInterval(fetchScan, 5000);
setInterval(fetchResources, 5000);
setInterval(tickUpdated, 1000);
</script>

</html>
